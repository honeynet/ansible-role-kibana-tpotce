---
- name: Ensure dependencies are installed.
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure the apt keyring directory exists.
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

# apt_key is deprecated and the trusted.gpg keyring is ignored on Debian 13, so
# the key is dropped into /etc/apt/keyrings and referenced by signed-by.
- name: Add the Elastic package signing key.
  ansible.builtin.get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /etc/apt/keyrings/elastic.asc
    owner: root
    group: root
    mode: '0644'

- name: Add the Elastic apt repository for channel {{ elastic_repo_channel }}
  ansible.builtin.deb822_repository:
    name: elastic-{{ elastic_repo_channel }}
    types: [deb]
    uris: "https://artifacts.elastic.co/packages/{{ elastic_repo_channel }}/apt"
    suites: [stable]
    components: [main]
    signed_by: /etc/apt/keyrings/elastic.asc
    enabled: true
    state: present
  register: kibana_repository

- name: Refresh the apt cache after a repository change.
  ansible.builtin.apt:
    update_cache: true
  when: kibana_repository.changed

- name: Determine the currently installed Kibana version.
  ansible.builtin.command:
    cmd: dpkg-query --showformat=${Version} --show {{ kibana_package }}
  register: kibana_installed_version
  failed_when: false
  changed_when: false
  check_mode: false

- name: Release the Kibana version hold.
  ansible.builtin.dpkg_selections:
    name: "{{ kibana_package }}"
    selection: install
  # dpkg only knows a package it has seen before, so on a first install there is
  # no selection to release and the module would fail outright.
  when:
    - kibana_installed_version.rc == 0
    - >-
      not (elastic_version_lock | bool)
      or kibana_installed_version.stdout != kibana_package_version

- name: Install Kibana version {{ kibana_package_version }}
  ansible.builtin.apt:
    name: "{{ kibana_package }}={{ kibana_package_version }}"
    state: present
    allow_downgrade: true
  notify: restart kibana

- name: Hold the Kibana package at version {{ kibana_package_version }}
  ansible.builtin.dpkg_selections:
    name: "{{ kibana_package }}"
    selection: hold
  when: elastic_version_lock | bool
