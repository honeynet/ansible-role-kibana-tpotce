---
name: Upstream sync check
'on':
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Check geerlingguy/ansible-role-kibana for changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: kibana

      - name: Check out upstream geerlingguy/ansible-role-kibana
        uses: actions/checkout@v4
        with:
          repository: geerlingguy/ansible-role-kibana
          path: upstream

      # handlers/main.yml takes its structure from upstream but has been
      # adapted (ansible.builtin.systemd with daemon_reload instead of the
      # free-form service: module) — it is not byte-for-byte identical, even
      # at the commit README.md's Provenance section cites. So an upstream
      # change here is only ever flagged for a human to look at, never
      # applied automatically.
      - name: Compare tracked files against upstream
        id: diff
        working-directory: kibana
        run: |
          set -euo pipefail
          changed=0
          body_file="$RUNNER_TEMP/pr-body.md"
          : > "$body_file"

          for f in handlers/main.yml; do
            if ! diff -q "$f" "../upstream/$f" >/dev/null 2>&1; then
              changed=1
              {
                echo "### \`$f\` — NOT applied (this file has local changes; review manually)"
                echo '```diff'
                diff -u "$f" "../upstream/$f" || true
                echo '```'
                echo
              } >> "$body_file"
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Open or update a PR flagging the upstream change
        if: steps.diff.outputs.changed == '1'
        working-directory: kibana
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream_sha=$(git -C ../upstream rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b upstream-sync
          git commit --allow-empty -m "Upstream check: geerlingguy/ansible-role-kibana@${upstream_sha}"
          git push -u origin upstream-sync --force
          if ! gh pr list --head upstream-sync --state open --json number --jq '.[0]' | grep -q .; then
            gh pr create \
              --title "Upstream check: geerlingguy/ansible-role-kibana@${upstream_sha}" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --base master --head upstream-sync
          else
            gh pr edit upstream-sync --body-file "$RUNNER_TEMP/pr-body.md"
          fi
