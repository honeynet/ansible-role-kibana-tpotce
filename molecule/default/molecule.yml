---
role_name_check: 1

driver:
  name: docker

platforms:
  - name: kibana-molecule
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    # Molecule's docker driver substitutes a long sleep when no command is
    # given, which leaves PID 1 as bash and no systemd for the service tasks.
    command: "${MOLECULE_DOCKER_COMMAND:-/lib/systemd/systemd}"
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # /run only: Docker mounts tmpfs noexec, and Node needs an executable
    # temporary directory, so /tmp has to stay on a normal filesystem.
    tmpfs:
      - /run
    # Defaults to a normal bridge network. Set MOLECULE_DOCKER_NETWORK_MODE=host
    # where container egress is only available through the host's namespace.
    network_mode: "${MOLECULE_DOCKER_NETWORK_MODE:-bridge}"

provisioner:
  name: ansible
  config_options:
    defaults:
      stdout_callback: default
  inventory:
    host_vars:
      kibana-molecule:
        ansible_python_interpreter: /usr/bin/python3

verifier:
  name: ansible
